document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;}50%{transform:rotate(48deg);}}\n@keyframes openArm{0%,100%{transform:rotate(0);}50%{transform:rotate(-60deg);}}\n@keyframes tiltPelvis{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(6deg);}}\n@keyframes switchHips{0%,45%,100%{transform:scaleX(1);}50%,95%{transform:scaleX(-1);}}\n@keyframes legPressOut{0%,100%{transform:translateX(0);}50%{transform:translateX(-5px);}}\n\n/* ---- synchronized multi-joint cycles (all share 1.8s so segments stay in phase) ---- */\n/* realistic tempo: slow eccentric 0→45%, pause 45→55%, faster concentric 55→85%, rest at top */\n@keyframes sqTorso{0%{transform:translateY(0) rotate(0);}45%,55%{transform:translateY(7px) rotate(14deg);}85%,100%{transform:translateY(0) rotate(0);}}\n@keyframes sqThigh{0%{transform:rotate(0);}45%,55%{transform:rotate(-42deg);}85%,100%{transform:rotate(0);}}\n@keyframes sqShin{0%{transform:rotate(0);}45%,55%{transform:rotate(24deg);}85%,100%{transform:rotate(0);}}\n@keyframes sqArms{0%{transform:rotate(0);}45%,55%{transform:rotate(-18deg);}85%,100%{transform:rotate(0);}}\n/* hinge: slow fold, pause at depth, drive up */\n@keyframes hgTorso{0%{transform:rotate(8deg);}45%,55%{transform:rotate(62deg);}85%,100%{transform:rotate(8deg);}}\n@keyframes hgHips{0%{transform:translateX(0);}45%,55%{transform:translateX(4px);}85%,100%{transform:translateX(0);}}\n@keyframes hgArmHang{0%{transform:rotate(-8deg);}45%,55%{transform:rotate(-62deg);}85%,100%{transform:rotate(-8deg);}}\n/* press: drive up faster (concentric first), brief lockout hold, slower lower */\n@keyframes prUpper{0%{transform:rotate(0);}30%,45%{transform:rotate(-38deg);}90%,100%{transform:rotate(0);}}\n@keyframes prFore{0%{transform:rotate(72deg);}30%,45%{transform:rotate(6deg);}90%,100%{transform:rotate(72deg);}}\n/* row: pull back quick, squeeze hold, slow return */\n@keyframes rwElbow{0%{transform:rotate(38deg);}30%,45%{transform:rotate(-30deg);}90%,100%{transform:rotate(38deg);}}\n/* bridge: lift, squeeze hold at top, slow lower */\n@keyframes 00%{transform:rotate(0);}}\n\n.anim-squat{animation:squatY 1.6s ease-in-out infinite;transform-origin:center 60%;}\n.anim-press{animation:armsPress 1.5s ease-in-out infinite;}\n.anim-hinge{animation:tiltHinge 1.8s ease-in-out infinite;transform-origin:50% 62%;}\n.anim-leg{animation:swingLeg 1.7s ease-in-out infinite;transform-origin:50% 40%;}\n.anim-stretch{animation:stretchSide 2s ease-in-out infinite;transform-origin:50% 75%;}\n.anim-walk{animation:walkBob 0.9s ease-in-out infinite;transform-origin:center;}\n.anim-bob{animation:bobY 1.6s ease-in-out infinite;}\n.anim-steam1{animation:steamUp 1.8s ease-in-out infinite;}\n.anim-steam2{animation:steamUp 1.8s ease-in-out .6s infinite;}\n.anim-steam3{animation:steamUp 1.8s ease-in-out 1.2s infinite;}\n.anim-shake{animation:shakeIt 1.1s ease-in-out infinite;transform-origin:50% 80%;}\n.anim-pill{animation:pillDrop 1.6s ease-in infinite;}\n.anim-pulse{animation:pulseGlow 1.8s ease-in-out infinite;transform-origin:center;}\n.anim-hips{animation:liftHips 1.7s ease-in-out infinite;}\n.anim-extend{animation:extendUp 1.9s ease-in-out infinite;transform-origin:var(--org,50% 50%);}\n.anim-pulldown{animation:pullDownArms 1.5s ease-in-out infinite;}\n.anim-arch{animation:archFlex 2s ease-in-out infinite;transform-origin:50% 65%;}\n.anim-rock{animation:rockFwd 1.8s ease-in-out infinite;}\n.anim-heel{animation:heelUp 1.2s ease-in-out infinite;}\n.anim-armsout{animation:armsOutward 1.6s ease-in-out infinite;transform-origin:var(--org,50% 40%);}\n.anim-curlhead{animation:curlHead 1.9s ease-in-out infinite;transform-origin:var(--org,30% 60%);}\n.anim-pressout{animation:pressOut 1.5s ease-in-out infinite;}\n.anim-kneecurl{animation:kneeCurl 1.6s ease-in-out infinite;transform-origin:var(--org,50% 50%);}\n.anim-openarm{animation:openArm 2s ease-in-out infinite;transform-origin:var(--org,50% 50%);}\n.anim-pelvis{animation:tiltPelvis 1.6s ease-in-out infinite;transform-origin:50% 55%;}\n.anim-legpress{animation:legPressOut 1.5s ease-in-out infinite;}\n\n/* multi-joint segment classes — same duration keeps joints in phase */\n.j-sqTorso{animation:sqTorso 2.4s ease-in-out infinite;transform-origin:var(--org);}\n.j-sqThigh{animation:sqThigh 2.4s ease-in-out infinite;transform-origin:var(--org);}\n.j-sqShin{animation:sqShin 2.4s ease-in-out infinite;transform-origin:var(--org);}\n.j-sqArms{animation:sqArms 2.4s ease-in-out infinite;transform-origin:var(--org);}\n.j-hgTorso{animation:hgTorso 2.6s ease-in-out infinite;transform-origin:var(--org);}\n.j-hgHips{animation:hgHips 2.6s ease-in-out infinite;}\n.j-hgArm{animation:hgArmHang 2.6s ease-in-out infinite;transform-origin:var(--org);}\n.j-prUpper{animation:prUpper 2.2s ease-in-out infinite;transform-origin:var(--org);}\n.j-prFore{animation:prFore 2.2s ease-in-out infinite;transform-origin:var(--org);}\n.j-rwElbow{animation:rwElbow 2.2s ease-in-out infinite;transform-origin:var(--org);}\n.j-brPelvis{animation:brPelvis 2.4s ease-in-out infinite;transform-origin:var(--org);}\n.j-lgTorso{animation:lgTorso 2.3s ease-in-out infinite;}\n.j-lgFront{animation:lgFront 2.3s ease-in-out infinite;transform-origin:var(--org);}\n.j-lgBack{animation:lgBack 2.3s ease-in-out infinite;transform-origin:var(--org);}\n.j-gaitA{animation:gaitA 1.1s ease-in-out infinite;transform-origin:var(--org);}\n.j-gaitB{animation:gaitB 1.1s ease-in-out infinite;transform-origin:var(--org);}\n.j-gaitBody{animation:gaitBody 1.1s linear infinite;}\n.j-cuLift{animation:cuLift 3s ease-in-out infinite;transform-origin:var(--org);}\n.j-bdArm{animation:bdRaise 3.2s ease-in-out infinite;transform-origin:var(--org);}\n.j-bdLeg{animation:bdRaiseLeg 3.2s ease-in-out infinite;transform-origin:var(--org);}\n.j-crBody{animation:crBody 2.2s ease-in-out infinite;}\n.j-crHeel{animation:crHeel 2.2s ease-in-out infinite;transform-origin:var(--org);}\n.j-pdUpper{animation:pdUpper 2.2s ease-in-out infinite;transform-origin:var(--org);}\n.j-pdFore{animation:pdFore 2.2s ease-in-out infinite;transform-origin:var(--org);}\n.j-lrArm{animation:lrArm 2.2s ease-in-out infinite;transform-origin:var(--org);}\n/* ---- flipbook pose crossfade: each pose drawn complete & correct, blended ---- */\n@keyframes fbA{0%,38%{opacity:1;}52%,88%{opacity:0;}100%{opacity:1;}}\n@keyframes fbB{0%,38%{opacity:0;}52%,88%{opacity:1;}100%{opacity:0;}}\n.fbA{animation:fbA 2.4s ease-in-out infinite;}\n.fbB{animation:fbB 2.4s ease-in-out infinite;}\n.fb-slow .fbA{animation-duration:3.2s;}\n.fb-slow .fbB{animation-duration:3.2s;}\n\n@media (prefers-reduced-motion: reduce){\n  .card-anim [class*=\"anim-\"]{animation:none !important;}\n}\n\n.focus-anim{width:150px;height:150px;background:var(--green-light);border-radius:40px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(26,92,63,.1);}\n.focus-anim svg{width:118px;height:118px;stroke:var(--green-dark);color:var(--green-dark);}\n\n/* ---- modern UX polish ---- */\n.card{will-change:transform;}\n.day-panel.active .card{animation:cardIn .4s cubic-bezier(.32,.72,0,1) backwards;}\n.day-panel.active .card:nth-child(2){animation-delay:.03s;}\n.day-panel.active .card:nth-child(3){animation-delay:.06s;}\n.day-panel.active .card:nth-child(4){animation-delay:.09s;}\n.day-panel.active .card:nth-child(5){animation-delay:.12s;}\n.day-panel.active .card:nth-child(6){animation-delay:.15s;}\n@keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}\n.card:active{transform:scale(.995);}\n.tab, .navbtn, .big-btn, .logbtn, .lang-btn{-webkit-user-select:none;user-select:none;}\n::selection{background:var(--green-light);}\nh3.group{position:sticky;top:70px;z-index:5;}\n.card-title{letter-spacing:.1px;}\n.card-sub{letter-spacing:.05px;}\n@media (max-width:420px){\n  .card-anim{width:46px;height:46px;flex-basis:46px;border-radius:14px;}\n  .card-anim svg{width:38px;height:38px;}\n  .focus-exname{font-size:1.4em;}\n  .focus-big-timer{font-size:2.8em;}\n}\n\n/* icon containers */\n.gicon{display:inl transform .2s ease;}\n.sheet{transition:transform .38s cubic-bezier(.22,.61,.36,1);}\n.sheet-overlay{transition:opacity .28s ease;}\n.focus-overlay.open{animation:fadeIn .28s ease;}\nhtml{scrollbar-gutter:stable;}\n\n/* ===== v3 additions ===== */\n.pwa-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--green-dark);color:#fff;padding:10px 18px;font-size:.82em;}\n.pwa-banner strong{display:block;} .pwa-banner p{margin:2px 0 0;opacity:.85;font-size:.9em;}\n.pwa-banner button{background:rgba(255,255,255,.18);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;flex:0 0 28px;}\n.daily-log-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}\n.daily-log-card{flex:1;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.82em;font-weight:700;color:var(--txt-dim);box-shadow:var(--shadow);}\n.daily-log-card .counter{align-self:flex-start;}\n.daily-log-card .winput{width:100%;}\n.skip-day-btn{background:var(--card2);border:1px solid var(--border);color:var(--txt-dim);padding:6px 14px;border-radius:16px;font-size:.75em;font-weight:700;cursor:pointer;transition:all .2s ease;}\n.skip-day-btn.active{background:var(--green-light);color:var(--green-dark);border-color:rgba(26,92,63,.3);}\n\n/* ===== realistic exercise motion polish ===== */\n.card-anim svg, .focus-anim svg{overflow:visible;}\n.anim-floor{opacity:.16;}\n@keyframes floorSquash{0%{transform:scaleX(1);opacity:.16;}45%,55%{transform:scaleX(.72);opacity:.28;}85%,100%{transform:scaleX(1);opacity:.16;}}\n@keyframes floorSquashSlow{0%{transform:scaleX(1);opacity:.14;}30%,55%{transform:scaleX(.65);opacity:.26;}90%,100%{transform:scaleX(1);opacity:.14;}}\n.anim-floor-sq{animation:floorSquash 2.4s ease-in-out infinite;transform-origin:center;}\n.anim-floor-cr{animation:floorSquashSlow 2.2s ease-in-out infinite;transform-origin:center;}\n[class*=\ t a diagnosis or a substitute for evaluation by your physician or physical therapist.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"save-msg {{ saveCls }}\"><span data-lang=\"ar\">✓ تم الحفظ<\u002Fspan><span data-lang=\"en\">✓ Saved<\u002Fspan><\u002Fdiv>\n<div class=\"sheet-overlay {{ sheetOpenCls }}\" sc-camel-on-click=\"{{ closeSettings }}\"><\u002Fdiv>\n<div class=\"sheet {{ sheetOpenCls }}\">\n  <div class=\"sheet-handle\"><\u002Fdiv>\n  <h3><span data-lang=\"ar\">الإشعارات اليومية<\u002Fspan><span data-lang=\"en\">Daily Reminders<\u002Fspan><\u002Fh3>\n  <p class=\"card-sub\"><span data-lang=\"ar\">حدد وقت كل تذكير — هيبعتلك إشعار طول ما الصفحة مفتوحة على جهازك (بعد ما تضيفها للشاشة الرئيسية).<\u002Fspan><span data-lang=\"en\">Set a time for each reminder — you'll get a notification while this page is open on your device (after adding it to your home screen).<\u002Fspan><\u002Fp>\n  <sc-for list=\"{{ settingRows }}\" as=\"s\" hint-placeholder-count=\"7\">\n    <div class=\"setting-row\" style=\"{{ s.rowStyle }}\">\n      <label><span class=\"row-ic\">{{ s.iconEl }}<\u002Fspan> <span data-lang=\"ar\">{{ s.ar }}<\u002Fspan><span data-lang=\"en\">{{ s.en }}<\u002Fspan><\u002Flabel>\n      <input type=\"time\" value=\"{{ s.val }}\" sc-camel-on-input=\"{{ s.onChange }}\">\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <button class=\"big-btn\" sc-camel-on-click=\"{{ enableNotifications }}\"><span data-lang=\"ar\">تفعيل الإشعارات وحفظ المواعيد<\u002Fspan><span data-lang=\"en\">Enable Notifications &amp; Save Times<\u002Fspan><\u002Fbutton>\n  <div class=\"notif-status {{ notifOkCls }}\">{{ notifStatusText }}<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"bottomnav\">\n  <button class=\"navbtn {{ navTodayCls }}\" sc-camel-on-click=\"{{ goToday }}\"><span class=\"ic\">{{ homeIcon }}<\u002Fspan><span data-lang=\"ar\">اليوم<\u002Fspan><span data-lang=\"en\">Today<\u002Fspan><\u002Fbutton>\n  <button class=\"navbtn {{ navWeekCls }}\" sc-camel-on-click=\"{{ goWeek }}\"><span class=\"ic\">{{ calIcon }}<\u002Fspan><span data-lang=\"ar\">الأسبوع<\u002Fspan><span data-lang=\"en\">Week<\u002Fspan><\u002Fbutton>\n  <button class=\"navbtn {{ navNutritionCls }}\" sc-camel-on-click=\"{{ goNutrition }}\"><span class=\"ic\">{{ nutIcon }}<\u002Fspan><span data-lang=\"ar\">تغذية<\u002Fspan><span data-lang=\"en\">Nutrition<\u002Fspan><\u002Fbutton>\n  <button class=\"navbtn {{ navSuppsCls }}\" sc-camel-on-click=\"{{ goSupps }}\"><span class=\"ic\">{{ supIcon }}<\u002Fspan><span data-lang=\"ar\">مكملات<\u002Fspan><span data-lang=\"en\">Supplements<\u002Fspan><\u002Fbutton>\n  <button class=\"navbtn {{ navCoachCls }}\" sc-camel-on-click=\"{{ goCoach }}\"><span class=\"ic\">{{ coachNavIcon }}<\u002Fspan><span data-lang=\"ar\">المدرب<\u002Fspan><span data-lang=\"en\">Coach<\u002Fspan><\u002Fbutton>\n  <button class=\"navbtn {{ navProgressCls }}\" sc-camel-on-click=\"{{ goProgress }}\"><span class=\"ic\">{{ chartIcon }}<\u002Fspan><span data-lang=\"ar\">التقدم<\u002Fspan><span data-lang=\"en\">Progress<\u002Fspan><\u002Fbutton>\n  <button class=\"navbtn {{ navSettingsCls }}\" sc-camel-on-click=\"{{ openSettings }}\"><span class=\"ic\">{{ setIcon }}<\u002Fspan><span data-lang=\"ar\">إعدادات<\u002Fspan><span data-lang=\"en\">Settings<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<div class=\"sos-btn\" sc-camel-on-click=\"{{ openEmergency }}\"><span>{{ sosIcon }}<\u002Fspan><\u002Fdiv>\n<div class=\"sheet-overlay {{ emergencyOpenCls }}\" sc-camel-on-click=\"{{ closeEmergency }}\"><\u002Fdiv>\n<div class=\"sheet emergency-sheet {{ emergencyOpenCls }}\">\n  <div class=\"sheet-handle\"><\u002Fdiv>\n  <h3 style=\"color:#c0392b\"><span data-lang=\"ar\">علامات خطر — روح دكتور فورًا لو حسيت بـ:<\u002Fspan><span data-lang=\"en\">Warning Signs — Seek care immediately if you notice:<\u002Fspan><\u002Fh3>\n  <ul class=\"emergency-list\">\n    <li><span data-lang=\"ar\">تنميل أو ضعف جديد أو متزايد، أو صعوبة رفع مقدمة القدم<\u002Fspan><span data-lang=\"en\">New or worsening numbness/weakness, or difficulty lifting the front of the foot<\u002Fspan><\u002Fli>\n    <li><span data-lang=\"ar\">تنميل بينتشر، أو في منطقة الفخذ الداخلي/العجان<\u002Fspan><span data-lang=\"en\">Spreading numbness, or numbness in the inner thigh/groin area<\u002Fspan><\u002Fli>\n    <li><span data-lang=\"ar\"><strong>فقدان السيطرة على البول أو البراز — طوارئ، روح المستشفى فورًا<\u002Fstrong><\u002Fspan><span data-lang=\"en\"><strong>Loss of bladder or bowel control — emergency, go to the ER immediately<\u002Fstrong><\u002Fspan><\u002Fli>\n    <li><span data-lang=\"ar\">ألم حاد كهربائي نازل في الرجل بشكل جديد أو بيزيد<\u002Fspan><span data-lang=\"en\">New or worsening sharp, electric, shooting leg pain<\u002Fspan><\u002Fli>\n    <li><span data-lang=\"ar\">ألم بيصحيك من النوم أو مش بيهدأ في أي وضعية<\u002Fspan><span data-lang=\"en\">Pain that wakes you from sleep or won't settle in any position<\u002Fspan><\u002Fli>\n  <\u002Ful>\n  <p style=\"font-size:.82em;color:var(--txt-dim)\"><span data-lang=\"ar\">لو حسيت بأي حاجة من دي، وقف أي تمرين فورًا وتواصل مع دكتورك أو اذهب لأقرب طوارئ.<\u002Fspan><span data-lang=\"en\">If you notice any of these, stop exercising immediately and contact your doctor or the nearest emergency room.<\u002Fspan><\u002Fp>\n  <button class=\"big-btn\" style=\"background:#c0392b\" sc-camel-on-click=\"{{ closeEmergency }}\"><span data-lang=\"ar\">فهمت<\u002Fspan><span data-lang=\"en\">Got it<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<button class=\"focus-fab\" sc-camel-on-click=\"{{ startFocusMode }}\">{{ fabPlayIcon }}<span data-lang=\"ar\">ابدأ التمرين<\u002Fspan><span data-lang=\"en\">Start Workout<\u002Fspan><\u002Fbutton>\n<div class=\"focus-overlay {{ focusOpenCls }}\">\n  <div class=\"focus-top\">\n    <button class=\"focus-close\" sc-camel-on-click=\"{{ exitFocus }}\">✕<\u002Fbutton>\n    <span class=\"focus-count\">{{ focusCount }}<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"focus-body\">\n    <sc-if value=\"{{ focusDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"level-badge\" style=\"width:70px;height:70px\">{{ trophyIcon }}<\u002Fdiv>\n      <h2 class=\"focus-exname\">{{ focusDoneText }}<\u002Fh2>\n      <button class=\"big-btn\" style=\"max-width:220px\" sc-camel-on-click=\"{{ exitFocus }}\">{{ focusOkText }}<\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ focusRest }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"focus-rest-label\">{{ restLabel }}<\u002Fdiv>\n      <div class=\"focus-big-timer rest\">{{ restRemaining }}<\u002Fdiv>\n      <p style=\"color:var(--txt-dim);margin:0\">{{ upNextText }} <strong>{{ focusName }}<\u002Fstrong><\u002Fp>\n      <div class=\"focus-actions\"><button class=\"big-btn skip-btn\" sc-camel-on-click=\"{{ skipRest }}\">{{ skipRestText }}<\u002Fbutton><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ focusExercise }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"focus-anim\">{{ focusAnim }}<\u002Fdiv>\n      <h2 class=\"focus-exname\">{{ focusName }}<\u002Fh2>\n      <div class=\"focus-target\">{{ focusTarget }}<\u002Fdiv>\n      <sc-if value=\"{{ focusIsHold }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"focus-big-timer\">{{ focusTimeLabel }}<\u002Fdiv><\u002Fsc-if>\n      <div class=\"focus-actions\">\n        <sc-if value=\"{{ focusShowStart }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"big-btn\" sc-camel-on-click=\"{{ startFocusHold }}\">{{ startText }}<\u002Fbutton><\u002Fsc-if>\n        <button class=\"big-btn skip-btn\" sc-camel-on-click=\"{{ completeFocusStep }}\">{{ focusDoneBtnText }}<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ focusHasVid }}\" hint-placeholder-val=\"{{ false }}\"><a class=\"vid\" target=\"_blank\" href=\"{{ focusVidUrl }}\">{{ fabPlayIcon }} <span>{{ videoText }}<\u002Fspan><\u002Fa><\u002Fsc-if>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ detailShow }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"sheet-overlay open\" sc-camel-on-click=\"{{ closeDetail }}\"><\u002Fdiv>\n  <div class=\"sheet open\">\n    <div class=\"sheet-handle\"><\u002Fdiv>\n    <h3 style=\"margin-bottom:2px\">{{ detailTitle }}<\u002Fh3>\n    <p class=\"card-sub\" style=\"margin-top:0\">{{ detailSub }}<\u002Fp>\n    <div class=\"note\" style=\"margin-top:14px\">{{ detailTip }}<\u002Fdiv>\n    <button class=\"big-btn\" sc-camel-on-click=\"{{ closeDetail }}\"><span data-lang=\"ar\">تمام<\u002Fspan><span data-lang=\"en\">Got it<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ celebrateShow }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"sheet-overlay open\" style=\"z-index:95\" sc-camel-on-click=\"{{ closeCelebrate }}\"><\u002Fdiv>\n  <div class=\"celebrate-card\">\n    <div class=\"celebrate-icon\">{{ coreIcon }}<\u002Fdiv>\n    <h3>{{ celebrateTitle }}<\u002Fh3>\n    <p>{{ celebrateMsg }}<\u002Fp>\n    <button class=\"big-btn\" sc-camel-on-click=\"{{ closeCelebrate }}\">{{ celebrateBtn }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;restSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:60,&quot;min&quot;:15,&quot;max&quot;:180,&quot;step&quot;:5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Workout&quot;},&quot;xpPerLevel&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:15,&quot;min&quot;:5,&quot;max&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gamification&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    ready:false, lang:'ar', dark:false, currentDay:'d1', nav:'today',\n    checked:{}, counters:{}, timeLeft:{}, running:{}, query:'',\n    painSel:{}, wInputs:{}, notesTick:0,\n    sheetOpen:false, emergencyOpen:false, notifStatus:null,\n    times:{mob:'07:30',breakfast:'09:00',snack1:'11:30',lunch:'14:00',gym:'17:30',snack2:'19:00',dinner:'21:00'},\n    focus:{open:false, idx:0, phase:'exercise', list:[], remaining:0, holdRunning:false},\n    celebrate:null, saveShow:false, voiceOn:false, photos:[],\n    detailItemId:null, pwaBannerShow:false, waterCount:0, sleepHours:''\n  };\n  intervals = {};\n  focusInterval = null;\n\n  ls(key, fb){ try{ const v = localStorage.getItem(key); return v==null? fb : JSON.parse(v); }catch(e){ return fb; } }\n  save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} this.showSaved(); }\n  showSaved(){\n    this.setState({saveShow:true});\n    clearTimeout(this._saveT);\n    this._saveT = setTimeout(()=>this.setState({saveShow:false}), 1100);\n  }\n  isAr(){ return this.state.lang !== 'en'; }\n  t(ar, en){ return this.isAr()? ar : en; }\n  svg(html){ return React.createElement('span', {style:{display:'contents'}, dangerouslySetInnerHTML:{__html: html||''}}); }\n\n  async componentDidMount(){\n    let tries=0;\n    while(!window.SpineData && tries<200){ await new Promise(r=>setTimeout(r,20)); tries++; }\n    this.D = window.SpineData;\n    let lang = 'ar';\n    try{ const raw = localStorage.getItem('lang'); if(raw) lang = raw.replace(/\"/g,''); }catch(e){}\n    if(lang!=='en') lang='ar';\n    const dark = this.ls('darkMode', false);\n    const checked={}, counters={}, timeLeft={};\n    this.D.DAYS.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{\n      checked[it.id]=this.ls('chk_'+it.id,false);\n      counters[it.id]=this.ls('cnt_'+it.id,0);\n      if(it.type==='hold') timeLeft[it.id]=this.ls('time_'+it.id,it.target);\n    })));\n    const savedTimes = this.ls('notifTimes', null);\n    this.applyDoc(lang, dark);\n    this.setState({\n      ready:true, lang, dark, checked, counters, timeLeft,\n      times: savedTimes || this.state.times,\n      voiceOn: this.ls('voiceModeOn', false),\n      photos: this.ls('reportPhotos', []),\n      waterCount: this.ls('water_'+this.todayKey(), 0),\n      sleepHours: this.ls('sleep_'+this.todayKey(), '')\n    }, ()=> this.recordDailySnapshot());\n    if('Notification' in window && Notification.permission==='granted' && savedTimes) this.startNotifLoop();\n    this.initSwipe();\n    const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;\n    if(!standalone && !this.ls('pwaBannerDismissed', false)) this.setState({pwaBannerShow:true});\n  }\n  componentWillUnmount(){\n    Object.values(this.intervals).forEach(i=>clearInterval(i));\n    if(this.focusInterval) clearInterval(this.focusInterval);\n    if(this._notifInterval) clearInterval(this._notifInterval);\n  }\n  applyDoc(lang, dark){\n    const html = document.documentElement;\n    html.lang = lang; html.dir = lang==='ar'?'rtl':'ltr';\n    html.classList.toggle('dark', !!dark);\n  }\n  toggleLang(){\n    const lang = this.isAr()? 'en':'ar';\n    try{ localStorage.setItem('lang', lang); }catch(e){}\n    this.applyDoc(lang, this.state.dark);\n    this.setState({lang});\n  }\n  toggleTheme(){\n    const dark = !this.state.dark;\n    this.save('darkMode', dark);\n    this.applyDoc(this.state.lang, dark);\n    this.setState({dark});\n  }\n\n  findItem(id){ for(const d of this.D.DAYS) for(const g of d.groups) for(const it of g.items) if(it.id===id) return it; return null; }\n  dayOf(id){ for(const d of this.D.DAYS) for(const g of d.groups) for(const it of g.items) if(it.id===id) return d; return null; }\n  dayPct(d, checked){\n    let done=0, total=0;\n    d.groups.forEach(g=>g.items.forEach(it=>{ total++; if(checked[it.id]) done++; }));\n    return total? done/total*100 : 0;\n  }\n\n  awardXP(id){\n    const key = id+'_'+new Date().toDateString();\n    const xpLog = this.ls('xpLog', {});\n    if(xpLog[key]) return;\n    xpLog[key]=true;\n    this.save('xpLog', xpLog);\n    this.save('lifetimeXP', this.ls('lifetimeXP',0)+1);\n  }\n  getLevelInfo(){\n    const xp = this.ls('lifetimeXP', 0);\n    const perLevel = Number(this.props.xpPerLevel ?? 15);\n    return {xp, level: Math.floor(xp/perLevel)+1, inLevel: xp%perLevel, perLevel};\n  }\n\n  toggleCheck(id){\n    const checked = {...this.state.checked};\n    const now = !checked[id];\n    checked[id] = now;\n    this.save('chk_'+id, now);\n    this.vibrate(now?12:8);\n    if(now) this.awardXP(id);\n    let celebrate = this.state.celebrate;\n    const day = this.dayOf(id);\n    if(day){\n      const pct = this.dayPct(day, checked);\n      if(pct>=100){\n        if(!this.ls('celebrated_'+day.id, false)){\n          this.save('celebrated_'+day.id, true);\n          this.recordDayCompletion();\n          this.playBeep();\n          celebrate = day;\n        }\n      } else {\n        this.save('celebrated_'+day.id, false);\n      }\n    }\n    this.setState({checked, celebrate}, ()=>this.recordDailySnapshot());\n  }\n  changeCounter(id, delta){\n    const it = this.findItem(id);\n    const prev = this.state.counters[id]||0;\n    let v = Math.min(it.target, Math.max(0, prev+delta));\n    this.save('cnt_'+id, v);\n    this.setState(s=>({counters:{...s.counters,[id]:v}}));\n    this.vibrate(8);\n    if(prev===0 && v===1) this.speakExercise(it);\n    if(v>=it.target && !this.state.checked[id]) this.toggleCheck(id);\n  }\n\n  todayKey(){ return new Date().toDateString(); }\n  vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }\n  tipsFor(key){\n    const T = {\n      mob:{ar:'حركة صغيرة ومتحكم فيها أفضل من مدى واسع سريع — لو حسيت وخز أو ألم حاد، قلل المدى فورًا.',en:'Small, controlled range beats a fast wide range — if you feel sharp pain or tingling, reduce the range immediately.'},\n      core:{ar:'حافظ على تنفس طبيعي (متتنفسش نفسك) وشد البطن بهدوء بدل ما تقوّس الضهر.',en:'Keep breathing normally (don\\'t hold your breath) and brace the core gently instead of arching the back.'},\n      str:{ar:'ادخل في الإطالة تدريجيًا لحد ما تحس بشد خفيف، من غير ألم، وثبت من غير ما ترتد.',en:'Ease into the stretch gradually to a gentle pull, never pain, and hold still without bouncing.'},\n      gym:{ar:'ابدأ بوزن تقدر تتحكم فيه بالكامل، وركّز على نزول بطيء (2-3 ثواني) قبل ما تزوّد الوزن.',en:'Start with a weight you fully control, focus on a slow lowering phase (2-3s) before adding load.'},\n      cardio:{ar:'حافظ على إيقاع تقدر تتكلم فيه براحة (Zone 2) — مش سباق.',en:'Keep a pace you can comfortably talk through (Zone 2) — not a race.'},\n    };\n    return T[key] || T.mob;\n  }\n  openDetail(id){ this.setState({detailItemId:id}); }\n  closeDetail(){ this.setState({detailItemId:null}); }\n  addWater(delta){\n    const key = 'water_'+this.todayKey();\n    const v = Math.max(0, (this.state.waterCount||0)+delta);\n    this.save(key, v);\n    this.vibrate(10);\n    this.setState({waterCount:v});\n  }\n  setSleepHours(val){\n    this.save('sleep_'+this.todayKey(), val);\n    this.setState({sleepHours:val});\n  }\n  sendToAppleHealth(){\n    const water = this.state.waterCount||0;\n    const sleep = this.state.sleepHours||'';\n    let weight = null;\n    for(const d of this.D.DAYS){ for(const g of d.groups){ for(const it of g.items){\n      if(it.sets){ const logs=this.ls('wlog_'+it.id,[]); if(logs.length){ const l=logs[logs.length-1]; if(l.date===this.todayKey() && l.weight!=null) weight=l.weight; } }\n    }}}\n    const payload = {water_cups:water, sleep_hours:sleep, weight_kg:weight, date:this.todayKey()};\n    const input = encodeURIComponent(JSON.stringify(payload));\n    const url = `shortcuts://run-shortcut?name=${encodeURIComponent('Log Spine Recovery')}&input=text&text=${input}`;\n    window.location.href = url;\n    this.setState({healthSentTick:(this.state.healthSentTick||0)+1});\n  }\n  dismissPwaBanner(){ this.save('pwaBannerDismissed', true); this.setState({pwaBannerShow:false}); }\n  isDaySkipped(dayId){ return this.ls('skipped_'+dayId+'_'+this.todayKey(), false); }\n  toggleSkipDay(dayId){\n    const now = !this.isDaySkipped(dayId);\n    this.save('skipped_'+dayId+'_'+this.todayKey(), now);\n    if(now){\n      const dates = this.ls('skippedDates', []);\n      const today = this.todayKey();\n      if(!dates.includes(today)){ dates.push(today); if(dates.length>90) dates.shift(); this.save('skippedDates', dates); }\n    }\n    this.forceUpdate();\n  }\n  playBeep(){\n    try{\n      const ctx = new (window.AudioContext||window.webkitAudioContext)();\n      [880,1108,1320].forEach((freq,i)=>{\n        const osc=ctx.createOscillator(), gain=ctx.createGain();\n        osc.type='sine'; osc.frequency.value=freq;\n        const start=ctx.currentTime+i*0.14;\n        gain.gain.setValueAtTime(0.0001,start);\n        gain.gain.exponentialRampToValueAtTime(0.25,start+0.02);\n        gain.gain.exponentialRampToValueAtTime(0.0001,start+0.32);\n        osc.connect(gain).connect(ctx.destination);\n        osc.start(start); osc.stop(start+0.35);\n      });\n    }catch(e){}\n  }\n  fmtTime(sec){\n    sec = Math.max(0, Math.round(sec));\n    const m=Math.floor(sec/60), s=sec%60;\n    return m>0? m+':'+String(s).padStart(2,'0') : s+'s';\n  }\n  startTimer(id, target){\n    if(this.intervals[id]) return;\n    const it = this.findItem(id);\n    if(it) this.speakExercise(it);\n    let remaining = this.state.timeLeft[id];\n    if(remaining==null || remaining<=0) remaining = target;\n    this.setState(s=>({running:{...s.running,[id]:true}, timeLeft:{...s.timeLeft,[id]:remaining}}));\n    this.intervals[id] = setInterval(()=>{\n      remaining -= 1;\n      this.save('time_'+id, remaining);\n      this.setState(s=>({timeLeft:{...s.timeLeft,[id]:remaining}}));\n      if(remaining<=0){\n        clearInterval(this.intervals[id]); delete this.intervals[id];\n        this.setState(s=>({running:{...s.running,[id]:false}}));\n        this.playBeep();\n        this.vibrate([15,60,15]);\n        if(!this.state.checked[id]) this.toggleCheck(id);\n      }\n    }, 1000);\n  }\n  resetTimer(id, target){\n    if(this.intervals[id]){ clearInterval(this.intervals[id]); delete this.intervals[id]; }\n    this.save('time_'+id, target);\n    this.setState(s=>({running:{...s.running,[id]:false}, timeLeft:{...s.timeLeft,[id]:target}}));\n  }\n\n  recordDayCompletion(){\n    const today = new Date().toDateString();\n    const dates = this.ls('completedDates', []);\n    if(!dates.includes(today)){ dates.push(today); if(dates.length>90) dates.shift(); this.save('completedDates', dates); }\n  }\n  computeStreak(){\n    const dates = this.ls('completedDates', []).concat(this.ls('skippedDates', []));\n    if(!dates.length) return 0;\n    const set = new Set(dates);\n    let streak=0, cursor=new Date();\n    if(!set.has(cursor.toDateString())) cursor.setDate(cursor.getDate()-1);\n    while(set.has(cursor.toDateString())){ streak++; cursor.setDate(cursor.getDate()-1); }\n    return streak;\n  }\n  recordDailySnapshot(){\n    if(!this.D) return;\n    let done=0, total=0;\n    this.D.DAYS.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{ total++; if(this.state.checked[it.id]) done++; })));\n    const pct = total? Math.round(done/total*100):0;\n    const today = new Date().toDateString();\n    const hist = this.ls('weekPctHistory', []);\n    const idx = hist.findIndex(h=>h.date===today);\n    if(idx>=0) hist[idx].pct=pct; else hist.push({date:today,pct});\n    if(hist.length>30) hist.shift();\n    try{ localStorage.setItem('weekPctHistory', JSON.stringify(hist)); }catch(e){}\n  }\n\n  setPain(id, level){ this.setState(s=>({painSel:{...s.painSel,[id]:level}})); }\n  logExercise(id){\n    const weightStr = this.state.wInputs[id];\n    const weight = weightStr? parseFloat(weightStr): null;\n    const pain = this.state.painSel[id] || null;\n    if(weight===null && pain===null) return;\n    const logs = this.ls('wlog_'+id, []);\n    const today = new Date().toDateString();\n    const existingIdx = logs.findIndex(l=>l.date===today);\n    const entry = {date:today, weight: weight!==null? weight : (logs.length? logs[logs.length-1].weight:null), pain};\n    if(existingIdx>=0) logs[existingIdx]=entry; else logs.push(entry);\n    if(logs.length>60) logs.shift();\n    this.save('wlog_'+id, logs);\n    this.setState(s=>({wInputs:{...s.wInputs,[id]:''}, notesTick:s.notesTick+1}));\n  }\n  adaptiveNote(id){\n    const logs = this.ls('wlog_'+id, []);\n    if(!logs.length) return null;\n    const last = logs[logs.length-1];\n    if(last.pain>=3) return {cls:'warn-note', text:this.t('حسيت بألم أعلى المرة دي — يفضل تقلل الوزن أو الحمل في المرة الجاية وترجع تدريجيًا','You logged higher pain this time — consider reducing the weight/load next time and progressing gradually')};\n    if(last.pain===1 && logs.length>=2) return {cls:'ok-note', text:this.t('مفيش ألم مسجل وده كويس — لو حاسس إن التمرين بقى سهل ممكن تزود شوية الأسبوع الجاي','No pain logged — nice. If it felt easy, you can progress slightly next week')};\n    return null;\n  }\n\n  navFor(dayId){\n    return dayId==='nutrition'?'nutrition': dayId==='supplements'?'supplements': dayId==='progress'?'progress': dayId==='coach'?'coach':'week';\n  }\n  switchDay(dayId, nav){\n    if(dayId==='progress') this.recordDailySnapshot();\n    if(dayId===this.state.currentDay) return;\n    this.setState({currentDay:dayId, nav: nav || this.navFor(dayId), navPulse:true});\n    clearTimeout(this._navPulseT);\n    this._navPulseT = setTimeout(()=>this.setState({navPulse:false}), 350);\n    requestAnimationFrame(()=>{\n      const tabs = document.querySelector('.tabs');\n      const activeTab = tabs && tabs.querySelector('.tab.active');\n      if(activeTab) activeTab.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});\n    });\n  }\n  scrollTop(){ window.scrollTo({top:0, behavior:'smooth'}); }\n  goToday(){\n    const idx = new Date().getDay();\n    this.switchDay(this.D.DAYS[idx%7].id, 'today');\n    this.scrollTop();\n  }\n  goWeek(){ this.setState({nav:'week'}); this.scrollTop(); }\n  goTab(id){ this.switchDay(id); this.scrollTop(); }\n\n  jumpToItem(dayId, itemId){\n    this.setState({query:''});\n    this.switchDay(dayId);\n    setTimeout(()=>{\n      const card = document.getElementById('card_'+itemId);\n      if(card){\n        const y = card.getBoundingClientRect().top + window.scrollY - 150;\n        window.scrollTo({top:y, behavior:'smooth'});\n        card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');\n      }\n    }, 300);\n  }\n\n  startFocusMode(){\n    let day = this.D.DAYS.find(d=>d.id===this.state.currentDay);\n    if(!day || !day.groups.length) day = this.D.DAYS[new Date().getDay()%7];\n    const list = [];\n    day.groups.forEach(g=>g.items.forEach(it=>{ if(it.type==='reps'||it.type==='hold') list.push(it); }));\n    if(!list.length) return;\n    let idx = list.findIndex(it=>!this.state.checked[it.id]);\n    if(idx<0) idx=0;\n    if(this.focusInterval){ clearInterval(this.focusInterval); this.focusInterval=null; }\n    const it = list[idx];\n    this.speakExercise(it);\n    this.setState({focus:{open:true, idx, phase:'exercise', list, remaining: it.type==='hold'? it.target:0, holdRunning:false}});\n  }\n  exitFocus(){\n    if(this.focusInterval){ clearInterval(this.focusInterval); this.focusInterval=null; }\n    if(window.speechSynthesis) window.speechSynthesis.cancel();\n    this.setState(s=>({focus:{...s.focus, open:false, holdRunning:false}}));\n  }\n  restSecondsVal(){ return Number(this.props.restSeconds ?? 60); }\n  startFocusHold(){\n    const f = this.state.focus;\n    if(this.focusInterval || f.phase!=='exercise') return;\n    let remaining = f.remaining || (f.list[f.idx]? f.list[f.idx].target:0);\n    this.setState(s=>({focus:{...s.focus, holdRunning:true}}));\n    this.focusInterval = setInterval(()=>{\n      remaining--;\n      this.setState(s=>({focus:{...s.focus, remaining}}));\n      if(remaining<=0){\n        clearInterval(this.focusInterval); this.focusInterval=null;\n        this.playBeep();\n        this.completeFocusStep();\n      }\n    }, 1000);\n  }\n  completeFocusStep(){\n    if(this.focusInterval){ clearInterval(this.focusInterval); this.focusInterval=null; }\n    const f = this.state.focus;\n    const it = f.list[f.idx];\n    if(it && !this.state.checked[it.id]) this.toggleCheck(it.id);\n    const idx = f.idx+1;\n    const rest = idx < f.list.length && it && it.sets;\n    if(rest){\n      let remaining = this.restSecondsVal();\n      this.setState(s=>({focus:{...s.focus, idx, phase:'rest', remaining, holdRunning:false}}));\n      this.focusInterval = setInterval(()=>{\n        remaining--;\n        this.setState(s=>({focus:{...s.focus, remaining}}));\n        if(remaining<=0){\n          clearInterval(this.focusInterval); this.focusInterval=null;\n          this.playBeep();\n          this.enterFocusExercise(idx);\n        }\n      }, 1000);\n    } else {\n      this.enterFocusExercise(idx);\n    }\n  }\n  enterFocusExercise(idx){\n    const f = this.state.focus;\n    const it = f.list[idx];\n    if(it) this.speakExercise(it); else this.playBeep();\n    this.setState(s=>({focus:{...s.focus, idx, phase:'exercise', remaining: it && it.type==='hold'? it.target:0, holdRunning:false}}));\n  }\n  skipRest(){\n    if(this.focusInterval){ clearInterval(this.focusInterval); this.focusInterval=null; }\n    this.enterFocusExercise(this.state.focus.idx);\n  }\n\n  toggleVoice(){\n    const on = !this.state.voiceOn;\n    this.save('voiceModeOn', on);\n    this.setState({voiceOn:on});\n  }\n  speakExercise(it){\n    if(!this.state.voiceOn || !('speechSynthesis' in window)) return;\n    const isAr = this.isAr();\n    const name = isAr? it.ar : it.en;\n    let text = name;\n    if(it.type==='hold') text = isAr? `${name}، ثبات ${it.target} ثانية` : `${name}, hold for ${it.target} seconds`;\n    else if(it.type==='reps') text = isAr? `${name}، ${it.target} تكرار` : `${name}, ${it.target} reps`;\n    try{\n      window.speechSynthesis.cancel();\n      const u = new SpeechSynthesisUtterance(text);\n      u.lang = isAr? 'ar-EG':'en-US'; u.rate = 0.95;\n      window.speechSynthesis.speak(u);\n    }catch(e){}\n  }\n\n  coachAnalyze(){\n    const hist = this.ls('weekPctHistory', []);\n    const last7 = hist.slice(-7), prev7 = hist.slice(-14,-7);\n    const avg = arr => arr.length? Math.round(arr.reduce((s,h)=>s+h.pct,0)/arr.length): null;\n    const exSummaries = [];\n    this.D.DAYS.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{\n      if(!it.sets) return;\n      const logs = this.ls('wlog_'+it.id, []);\n      if(!logs.length) return;\n      const recent = logs.slice(-5);\n      const painVals = recent.filter(l=>l.pain!=null).map(l=>l.pain);\n      const avgPain = painVals.length? painVals.reduce((s,p)=>s+p,0)/painVals.length: null;\n      const weights = recent.filter(l=>l.weight!=null).map(l=>l.weight);\n      exSummaries.push({item:it, logs, avgPain,\n        weightTrend: weights.length>=2? weights[weights.length-1]-weights[0]:0,\n        lastWeight: weights.length? weights[weights.length-1]:null});\n    })));\n    const painByWeekday = {};\n    this.D.DAYS.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{\n      this.ls('wlog_'+it.id, []).forEach(l=>{\n        if(l.pain>=3){ const wd=new Date(l.date).getDay(); painByWeekday[wd]=(painByWeekday[wd]||0)+1; }\n      });\n    })));\n    let worstWeekday=null, worstCount=0;\n    Object.keys(painByWeekday).forEach(wd=>{ if(painByWeekday[wd]>worstCount){ worstCount=painByWeekday[wd]; worstWeekday=Number(wd);} });\n    return {avg7:avg(last7), avgPrev7:avg(prev7), streak:this.computeStreak(), exSummaries, worstWeekday, worstCount, dataDays:hist.length};\n  }\n  coachBuildPlan(a){\n    const isAr = this.isAr();\n    const WD_AR=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];\n    const WD_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\n    const cards=[];\n    if(a.avg7!==null){\n      let msg, tone;\n      if(a.avgPrev7!==null && a.avg7 > a.avgPrev7+5){\n        msg = isAr? `التزامك طالع لفوق: ${a.avgPrev7}% ← ${a.avg7}% الأسبوع ده. كمّل بنفس الإيقاع.` : `Your consistency is climbing: ${a.avgPrev7}% → ${a.avg7}% this week. Keep this rhythm.`;\n        tone='ok';\n      } else if(a.avgPrev7!==null && a.avg7 < a.avgPrev7-5){\n        msg = isAr? `التزامك نزل من ${a.avgPrev7}% لـ ${a.avg7}%. مش مشكلة — رجّع الإيقاع بأبسط حاجة: خلّص الحركة اليومية بس (10 دقايق) لمدة 3 أيام ورا بعض.` : `Consistency dipped from ${a.avgPrev7}% to ${a.avg7}%. No problem — rebuild momentum with the simplest thing: just the daily mobility (10 min) for 3 days in a row.`;\n        tone='warn';\n      } else {\n        msg = isAr? `متوسط التزامك ${a.avg7}% الأسبوع ده — ثابت. الثبات أهم من الكمال في التأهيل.` : `Your average this week is ${a.avg7}% — steady. In rehab, steady beats perfect.`;\n        tone='ok';\n      }\n      cards.push({title:this.t('قراءة الأسبوع','Week Read'), msg, tone});\n    } else {\n      cards.push({title:this.t('قراءة الأسبوع','Week Read'), msg:this.t('لسه مفيش بيانات كفاية — استخدم التطبيق كام يوم وارجعلي.','Not enough data yet — use the app for a few days and come back.'), tone:'ok'});\n    }\n    a.exSummaries.forEach(s=>{\n      const name = isAr? s.item.ar : s.item.en;\n      if(s.avgPain!==null && s.avgPain>=2.5){\n        cards.push({title:name, tone:'warn',\n          msg: isAr? `الألم في التمرين ده عالي باستمرار. الأسبوع الجاي: قلل الوزن 20-30% (${s.lastWeight? 'من '+s.lastWeight+' لحوالي '+Math.round(s.lastWeight*0.75*2)/2+' كجم':''}) وركز على البطء والتحكم. لو الألم فضل عالي حتى بالوزن الأقل، وقّفه وقول لدكتورك.` :\n            `Pain on this exercise is consistently high. Next week: cut the load 20-30% (${s.lastWeight? 'from '+s.lastWeight+' to ~'+Math.round(s.lastWeight*0.75*2)/2+'kg':''}) and focus on slow control. If pain stays high even lighter, pause it and tell your doctor.`});\n      } else if(s.avgPain!==null && s.avgPain<=1.3 && s.weightTrend>=0 && s.logs.length>=3){\n        const suggested = s.lastWeight? Math.round((s.lastWeight*1.05)*2)/2 : null;\n        cards.push({title:name, tone:'ok',\n          msg: isAr? `مفيش ألم تقريبًا وأنت مستقر عليه من ${s.logs.length} تسجيلات. جاهز لزيادة صغيرة: ${suggested? s.lastWeight+' ← '+suggested+' كجم':'زوّد ~5%'} أو تكرار إضافي لكل سيت.` :\n            `Almost no pain and you've been stable across ${s.logs.length} logs. Ready for a small bump: ${suggested? s.lastWeight+' → '+suggested+'kg':'add ~5%'} or one extra rep per set.`});\n      }\n    });\n    if(a.worstWeekday!==null && a.worstCount>=2){\n      const dayName = isAr? WD_AR[a.worstWeekday] : WD_EN[a.worstWeekday];\n      cards.push({title:this.t('نمط لاحظته','Pattern I Noticed'), tone:'warn',\n        msg: isAr? `الألم العالي بيتسجل أكتر حاجة يوم ${dayName} (${a.worstCount} مرات). فكّر إيه اللي بيحصل قبله — نوم أقل؟ قعدة طويلة؟ يوم رجل تقيل؟ جرّب تخفف حمل اليوم اللي قبله وشوف الفرق.` :\n          `High pain logs cluster on ${dayName} (${a.worstCount} times). Think about what happens before it — less sleep? Long sitting? A heavy leg day? Try lightening the day before and see if it changes.`});\n    }\n    if(a.streak>=3){\n      cards.push({title:this.t('السلسلة','Streak'), tone:'ok', msg:this.t(`${a.streak} أيام متتالية — الاستمرارية دي هي اللي بتبني ضهر قوي. حافظ عليها حتى لو بيوم مخفف.`,`${a.streak} days in a row — this consistency is what builds a strong back. Protect it, even with a light day.`)});\n    } else if(a.dataDays>=5 && a.streak===0){\n      cards.push({title:this.t('نصيحة اليوم',\"Today's Nudge\"), tone:'warn', msg:this.t('ابدأ سلسلة جديدة النهاردة بأصغر خطوة: افتح وضع التركيز وخلّص الحركة اليومية بس. اليوم الكامل مش شرط.',\"Start a new streak today with the smallest step: open focus mode and finish just the mobility routine. A full day isn't required.\")});\n    }\n    const hist = this.ls('weekPctHistory', []);\n    if(hist.length>=7){\n      const byWd = {};\n      hist.forEach(x=>{ const wd=new Date(x.date).getDay(); (byWd[wd]=byWd[wd]||[]).push(x.pct); });\n      let bestWd=null, bestAvg=-1;\n      Object.keys(byWd).forEach(wd=>{ const av=byWd[wd].reduce((s,p)=>s+p,0)/byWd[wd].length; if(av>bestAvg){bestAvg=av; bestWd=Number(wd);} });\n      if(bestWd!==null && bestAvg>=50){\n        cards.push({title:this.t('أقوى أيامك','Your Strongest Day'), tone:'ok',\n          msg: isAr? `يوم ${WD_AR[bestWd]} هو أعلى أيامك التزامًا (${Math.round(bestAvg)}%). حط فيه أصعب تمريناتك واستغل الطاقة دي.` :\n            `${WD_EN[bestWd]} is your most consistent day (${Math.round(bestAvg)}%). Schedule your hardest sessions there.`});\n      }\n    }\n    const readyCount = a.exSummaries.filter(s=>s.avgPain!==null && s.avgPain<=1.3 && s.logs.length>=3).length;\n    if(readyCount>=3){\n      cards.push({title:this.t('أسبوع تقدم','Progression Week'), tone:'ok',\n        msg:this.t(`${readyCount} تمارين مستقرة بدون ألم — الأسبوع الجاي مناسب لزيادات صغيرة في الحمل (2.5-5%) عليهم كلهم.`,`${readyCount} exercises are stable and pain-free — next week is a good time for small load increases (2.5-5%) across them.`)});\n    }\n    if(a.streak>=10){\n      cards.push({title:this.t('نصيحة ديلود','Deload Tip'), tone:'warn',\n        msg:this.t(`${a.streak} يوم متواصل — جسمك بيبني في الراحة. خصص 2-3 أيام أخف (نص الأحمال) الأسبوع ده عشان تكمل أقوى.`,`${a.streak} straight days — the body adapts during recovery. Take 2-3 lighter days (half loads) this week to come back stronger.`)});\n    }\n    const skipped = this.ls('skippedDates', []).length;\n    if(skipped>=2){\n      cards.push({title:this.t('أيام الراحة','Rest Days'), tone:'ok',\n        msg:this.t(`سجّلت ${skipped} يوم راحة موثّق — ده أفضل من إنك تكسر الروتين بصمت وتحس بالذنب. استمر تسجّلها براحة.`,`You've logged ${skipped} tracked rest day(s) — better than silently breaking the routine and feeling guilty. Keep logging them honestly.`)});\n    }\n    return cards;\n  }\n\n  exportBackup(){\n    const data={};\n    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); data[k]=localStorage.getItem(k); }\n    const blob = new Blob([JSON.stringify(data)],{type:'application/json'});\n    const url .trophy);\n\n    const streak = this.computeStreak();\n    if(streak>0){ base.showStreak=true; base.streakText = isAr? `${streak} يوم متتالي 🔥` : `${streak}-day streak 🔥`; }\n\n    const C = 226.19;\n    let weekDone=0, weekTotal=0, dayPct=0;\n    D.DAYS.forEach(d=>{\n      let done=0,total=0;\n      d.groups.forEach(g=>g.items.forEach(it=>{ total++; if(S.checked[it.id]) done++; }));\n      weekDone+=done; weekTotal+=total;\n      if(d.id===S.currentDay && total) dayPct = done/total*100;\n    });\n    const weekPct = weekTotal? weekDone/weekTotal*100:0;\n    base.ringDayOffset = (C-(dayPct/100)*C).toFixed(1);\n    base.ringWeekOffset = (C-(weekPct/100)*C).toFixed(1);\n    base.ringDayPct = Math.round(dayPct)+'%'; base.ringWeekPct = Math.round(weekPct)+'%';\n    base.ringDayComplete = dayPct>=100?'complete':''; base.ringWeekComplete = weekPct>=100?'complete':'';\n\n    const q = S.query.trim().toLowerCase();\n    if(q.length>=2){\n      base.searchShowCls='show';\n      let count=0;\n      D.DAYS.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{\n        if(count>=8) return;\n        if((it.ar+' '+it.en).toLowerCase().includes(q)){\n          count++;\n          base.searchResults.push({name: isAr?it.ar:it.en, dayName: isAr?d.ar:d.en, go:()=>this.jumpToItem(d.id,it.id)});\n        }\n      })));\n      base.searchEmpty = base.searchResults.length===0;\n    }\n\n    const h = new Date().getHours();\n    const todayDay = D.DAYS[new Date().getDay()%7];\n    const todayPct = this.dayPct(todayDay, S.checked);\n    let remainCount = 0;\n    todayDay.groups.forEach(g=>g.items.forEach(it=>{ if(!S.checked[it.id]) remainCount++; }));\n    base.suggestShow = true;\n    if(todayPct>=100){\n      base.suggestTitle = isAr?'خلصت يومك — برافو 👏':'Day complete — nice work 👏';\n      base.suggestSub = isAr?'إطالة خفيفة اختيارية قبل النوم تحسّن نومك':'Optional light stretching before bed improves sleep';\n    } else if(todayPct>0){\n      base.suggestTitle = isAr?`كمّل يومك — فاضلك ${remainCount} عناصر`:`Finish your day — ${remainCount} items left`;\n      base.suggestSub = isAr?`إنجازك ${Math.round(todayPct)}% · دوس وكمّل بوضع التركيز`:`You're at ${Math.round(todayPct)}% · tap to continue in focus mode`;\n    } else if(h<12){\n      base.suggestTitle = isAr?'صباح الخير — ابدأ بالحركة اليومية':'Good morning — start with mobility';\n      base.suggestSub = isAr?'10-12 دقيقة تجهّز ضهرك لليوم':'10-12 minutes to prep your back for the day';\n    } else if(h<20){\n      base.suggestTitle = isAr?`وقت التمرين — ${todayDay.ar}`:`Workout time — ${todayDay.en}`;\n      base.suggestSub = isAr?'دوس هنا وابدأ وضع التركيز':'Tap to start focus mode';\n    } else {\n      base.suggestTitle = isAr?'قبل النوم — إطالة خفيفة':'Before bed — light stretching';\n      base.suggestSub = isAr?'خمس دقايق إطالة تحسّن نومك':'Five minutes of stretching improves your sleep';\n    }\n    base.suggestGo = ()=>{ this.switchDay(todayDay.id); this.startFocusMode(); };\n\n    const nowD = new Date();\n    if(nowD.getDay()===5 || nowD.getDay()===6){\n      const hist = this.ls('weekPctHistory',[]).slice(-7);\n      if(hist.length){\n        base.weeklyShow=true;\n        base.weeklyTitle = isAr?'ملخص أسبوعك 🏆':'Your Week in Review 🏆';\n        base.weeklyAvg = Math.round(hist.reduce((s,x)=>s+x.pct,0)/hist.length)+'%';\n        base.weeklyAvgLbl = isAr?'متوسط الالتزام':'avg consistency';\n        base.weeklyFull = String(hist.filter(x=>x.pct>=100).length);\n        base.weeklyFullLbl = isAr?'أيام كاملة':'full days';\n        base.weeklyStreak = String(streak);\n        base.weeklyStreakLbl = isAr?'سلسلة متتالية':'day streak';\n      }\n    }\n\n    base.tabs = D.DAYS.map(d=>({\n      ar:d.ar, en:d.en,\n      iconEl: d.icon? React.createElement('span',{className:'tab-ic'},this.svg(I[d.icon])) : null,\n      activeCls: d.id===S.currentDay?'active':'',\n      go:()=>this.switchDay(d.id),\n    }));\n\n    base.days = D.DAYS.filter(d=>d.groups.length).map(d=>{\n      const pct = this.dayPct(d, S.checked);\n      return {\n        id:d.id, ar:d.ar, en:d.en,\n        activeCls: d.id===S.currentDay?'active':'',\n        pct: pct.toFixed(1), pctLabel: Math.round(pct)+'%', barCls: pct>=100?'complete':'',\n        skipBtnText: this.isDaySkipped(d.id)? (isAr?'✓ يوم راحة':'✓ Rest day') : (isAr?'تخطي اليوم':'Skip day'),\n        skipBtnCls: this.isDaySkipped(d.id)?'active':'',\n        toggleSkip:()=>this.toggleSkipDay(d.id),\n        groups: d.groups.map(g=>({\n          ar:g.ar, en:g.en,\n          iconEl: this.svg(D.GROUP_ICON[g.key]||''),\n          countLabel: g.items.filter(x=>S.checked[x.id]).length + '/' + g.items.length,\n          items: g.items.map(it=>{\n            const done = !!S.checked[it.id];\n            const cnt = S.counters[it.id]||0;\n            const setsInfo = it.sets? it.sets+' × ':'';\n            let subAr='', subEn='';\n            if(it.type==='hold'){ subAr=`${setsInfo}ثبات ${it.target} ثانية`; subEn=`${setsInfo}hold ${it.target}s`; }\n            else if(it.type==='reps'){ subAr=`${setsInfo}${it.target} تكرار`; subEn=`${setsInfo}${it.target} reps`; }\n            else if(it.type==='info'){ subAr=it.desc_ar||''; subEn=it.desc_en||''; }\n            const note = it.sets? this.adaptiveNote(it.id) : null;\n            const logs = it.sets? this.ls('wlog_'+it.id,[]) : [];\n            const lastW = logs.length && logs[logs.length-1].weight!=null? String(logs[logs.length-1].weight):'';\n            const pSel = S.painSel[it.id];\n            return {\n              id:it.id, ar:it.ar, en:it.en,\n              doneCls: done?'done':'', chkCls: done?'checked':'',\n              toggle:()=>this.toggleCheck(it.id),\n              openDetail: it.type!=='info'? ()=>this.openDetail(it.id) : undefined,\n              animCls: (it.id.startsWith('n')||it.id.startsWith('sup'))?'food':'',\n              animEl:this.svg(D.getAnim(it)),\n              subEl: React.createElement(React.Fragment,null,\n                React.createElement('span',{key:'a','data-lang':'ar',dangerouslySetInnerHTML:{__html:subAr}}),\n                React.createElement('span',{key:'e','data-lang':'en',dangerouslySetInnerHTML:{__html:subEn}})),\n              hasVid: !!it.q,\n              vidUrl: it.q? 'https://www.youtube.com/results?search_query='+encodeURIComponent(it.q):'',\n              playIcon: this.svg(I.play),\n              isReps: it.type==='reps',\n              cntLabel: cnt+'/'+it.target,\n              inc:()=>this.changeCounter(it.id,1), dec:()=>this.changeCounter(it.id,-1),\n              isHold: it.type==='hold',\n              timeLabel: this.fmtTime(S.timeLeft[it.id]!=null? S.timeLeft[it.id]: it.target),\n              timerCls: S.running[it.id]?'running':'',\n              start:()=>this.startTimer(it.id, it.target), reset:()=>this.resetTimer(it.id, it.target),\n              hasSets: !!it.sets,\n              wVal: S.wInputs[it.id]||'',\n              wPh: lastW || (isAr?'كجم':'kg'),\n              onWeight: e=>{ const v=e.target.value; this.setState(s=>({wInputs:{...s.wInputs,[it.id]:v}})); },\n              p1cls:pSel===1?'active':'', p2cls:pSel===2?'active':'', p3cls:pSel===3?'active':'',\n              pain1:()=>this.setPain(it.id,1), pain2:()=>this.setPain(it.id,2), pain3:()=>this.setPain(it.id,3),\n              log:()=>this.logExercise(it.id),\n              hasNote: !!note, noteCls: note? note.cls:'', noteText: note? note.text:'',\n            };\n          })\n        }))\n      };\n    });\n\n    const TIMES_META = [\n      {key:'mob', ar:'الحركة اليومية', en:'Daily Mobility', icon:I.mob},\n      {key:'breakfast', ar:'الفطار', en:'Breakfast', icon:I.nutrition},\n      {key:'snack1', ar:'سناك 1', en:'Snack 1', icon:I.nutrition},\n      {key:'lunch', ar:'الغدا', en:'Lunch', icon:I.nutrition},\n      {key:'gym', ar:'الجيم / التمرين', en:'Gym / Workout', icon:I.gym},\n      {key:'snack2', ar:'سناك 2', en:'Snack 2', icon:I.nutrition},\n      {key:'dinner', ar:'العشا', en:'Dinner', icon:I.nutrition},\n    ];\n    base.settingRows = TIMES_META.map((r,i)=>({\n      ar:r.ar, en:r.en, iconEl:this.svg(r.icon),\n      val:S.times[r.key]||'',\n      rowStyle: i===TIMES_META.length-1? 'border-bottom:none':'',\n      onChange: e=>{ const v=e.target.value; this.setState(s=>({times:{...s.times,[r.key]:v}})); },\n    }));\n\n    base.progressActiveCls = S.currentDay==='progress'?'active':'';\n    base.coachActiveCls = S.currentDay==='coach'?'active':'';\n    const lvl = this.getLevelInfo();\n    base.levelTitle = isAr?`المستوى ${lvl.level}`:`Level ${lvl.level}`;\n    base.levelBarW = (lvl.inLevel/lvl.perLevel*100).toFixed(1);\n    base.levelSub = `${lvl.inLevel}/${lvl.perLevel} XP · ${isAr?'إجمالي':'total'} ${lvl.xp} XP`;\n    const hist14 = this.ls('weekPctHistory',[]).slice(-14);\n    const todayStr = new Date().toDateString();\n    base.chartTitle = isAr?'الالتزام آخر 14 يوم':'Last 14 Days Consistency';\n    base.chartBars = hist14.map(x=>({h:Math.max(x.pct,3), cls:x.date===todayStr?'today':'', lbl:String(new Date(x.date).getDate())}));\n    base.chartEmpty = !hist14.length;\n    base.noDataText = isAr?'لسه مفيش بيانات كفاية':'Not enough data yet';\n    base.streakCardTitle = isAr?`السلسلة المتتالية: ${streak} يوم`:`Current Streak: ${streak} days`;\n    base.streakCardSub = isAr?'خلّص كل حاجة في يومك عشان تحافظ على السلسلة':'Complete everything in your day to keep the streak going';\n    base.weightsTitle = isAr?'آخر الأوزان المسجلة':'Latest Logged Weights';\n    D.DAYS.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{\n      if(!it.sets) return;\n      const logs = this.ls('wlog_'+it.id,[]);\n      if(!logs.length) return;\n      const last = logs[logs.length-1];\n      base.weightRows.push({name: isAr?it.ar:it.en, wt: last.weight!=null? last.weight+'kg':'—', count: logs.length+' '+(isAr?'تسجيل':'logs')});\n    })));\n    base.weightsEmpty = !base.weightRows.length;\n    base.weightsEmptyText = isAr?'لسه ما سجلتش أوزان — سجّل وزن أي تمرين جيم عشان يظهر هنا':'No weights logged yet — log a gym exercise weight to see it here';\n    base.photosTitle = isAr?'صور التقارير والمتابعة':'Report & Progress Photos';\n    base.photosSub = isAr?'ارفع صور تقارير الأشعة أو صور متابعة (قبل/بعد) — بتتحفظ على جهازك بس':'Upload MRI/report photos or before-after progress shots — stored on your device only';\n    base.photoThumbs = S.photos.slice(-8).reverse().map(p=>{\n      const d = new Date(p.date);\n      return {src:p.data, lbl:d.getDate()+'/'+(d.getMonth()+1)};\n    });\n    base.photosEmpty = !base.photoThumbs.length;\n    base.photosEmptyText = isAr?'لسه مفيش صور — ضيف أول صورة تقرير أو متابعة':'No photos yet — add your first report or progress photo';\n    base.voiceTitle = isAr?'وضع الصوت':'Voice Mode';\n    base.voiceSub = isAr?'يقرا اسم التمرين وعدد التكرار بصوت عالي وانت بتتحرك، من غير ما تبص في الموبايل':'Reads the exercise name and reps out loud while you move, without looking at your phone';\n    base.voiceBtnText = S.voiceOn? (isAr?'🔊 مفعّل — دوس تقفل':'🔊 On — tap to turn off') : (isAr?'🔇 مقفول — دوس تشغّل':'🔇 Off — tap to turn on');\n    base.reportTitle = isAr?'تقرير شهري للطباعة':'Printable Monthly Report';\n    base.reportSub = isAr?'يجهزلك صفحة ملخص (الالتزام، الأوزان، السلسلة) تقدر تطبعها أو تحفظها PDF من نافذة الطباعة عشان توريها لدكتورك':'Prepares a summary page (consistency, weights, streak) you can print or save as PDF from the print dialog to show your doctor';\n    base.reportBtnText = isAr?'📄 جهّز التقرير':'📄 Generate Report';\n    base.backupTitle = isAr?'نسخة احتياطية':'Backup';\n    base.backupSub = isAr?'صدّر كل بياناتك (تشيك، أوزان، إعدادات) كملف تقدر ترفعه تاني لو غيّرت الجهاز':'Export all your data (checklist, weights, settings) as a file you can restore later or on a new device';\n    base.exportText = isAr?'⬇ تصدير':'⬇ Export';\n    base.importText = isAr?'⬆ استيراد':'⬆ Import';\n\n    base.coachTitle = isAr?'مدربك الافتراضي':'Your Virtual Coach';\n    base.coachSub = isAr?'تحليل مبني على بياناتك آخر 14 يوم':'Analysis based on your last 14 days of data';\n    if(S.currentDay==='coach'){\n      base.coachCards = this.coachBuildPlan(this.coachAnalyze()).map(c=>({title:c.title, msg:c.msg, cls:c.tone==='warn'?'coach-warn':'coach-ok'}));\n    }\n    base.coachDisclaimer = isAr?'المدرب ده بيحلل بياناتك بقواعد رياضية معروفة، ومش بديل عن دكتورك أو أخصائي العلاج الطبيعي — أي قرار كبير (زيادة وزن كبيرة، تمرين جديد، ألم مستمر) راجعه معاهم.':'This coach analyzes your data using established training rules — it is not a substitute for your doctor or physical therapist. Any big decision (major load increase, new exercise, persistent pain) should go through them.';\n\n    const f = S.focus;\n    base.focusOpenCls = f.open?'open':'';\n    if(f.open){\n      if(f.idx >= f.list.length){\n        base.focusDone = true;\n        base.focusDoneText = isAr?'خلصت التمرين! 🎉':'Workout complete! 🎉';\n        base.focusOkText = isAr?'تمام':'Done';\n      } else {\n        const it = f.list[f.idx];\n        base.focusCount = (f.idx+1)+' / '+f.list.length;\n        base.focusName = isAr? it.ar : it.en;\n        const setsInfo = it.sets? it.sets+' × ':'';\n        base.focusTarget = it.type==='hold'\n          ? (isAr?`${setsInfo}ثبات ${it.target} ثانية`:`${setsInfo}hold ${it.target}s`)\n          : (isAr?`${setsInfo}${it.target} تكرار`:`${setsInfo}${it.target} reps`);\n        if(f.phase==='rest'){\n          base.focusRest = true;\n          base.restLabel = isAr?'راحة':'Rest';\n          base.restRemaining = f.remaining;\n          base.upNextText = isAr?'التمرين الجاي:':'Up next:';\n          base.skipRestText = isAr?'تخطّي الراحة':'Skip Rest';\n        } else {\n          base.focusExercise = true;\n          base.focusAnim = this.svg(D.getAnim(it));\n          base.focusIsHold = it.type==='hold';\n          base.focusTimeLabel = this.fmtTime(f.remaining);\n          base.focusShowStart = it.type==='hold' && !f.holdRunning;\n          base.startText = isAr?'ابدأ':'Start';\n          base.focusDoneBtnText = isAr?'خلصته ✓':'Done ✓';\n          base.focusHasVid = !!it.q;\n          base.focusVidUrl = it.q? 'https://www.youtube.com/results?search_query='+encodeURIComponent(it.q):'';\n        }\n      }\n    }\n\n    if(S.celebrate){\n      base.celebrateTitle = isAr?'برافو! 🎉':'Great job! 🎉';\n      base.celebrateMsg = isAr?`خلّصت كل حاجة في ${S.celebrate.ar} النهاردة`:`You completed everything in ${S.celebrate.en} today`;\n      base.celebrateBtn = isAr?'تمام':'Nice';\n    }\n\n    if(S.detailItemId){\n      const it = this.findItem(S.detailItemId);\n      const day = this.dayOf(S.detailItemId);\n      const grp = day && day.groups.find(g=>g.items.some(x=>x.id===S.detailItemId));\n      if(it){\n        base.detailShow = true;\n        base.detailTitle = isAr? it.ar : it.en;\n        const setsInfo = it.sets? it.sets+' × ':'';\n        base.detailSub = it.type==='hold'\n          ? (isAr?`${setsInfo}ثبات ${it.target} ثانية`:`${setsInfo}hold ${it.target}s`)\n          : (isAr?`${setsInfo}${it.target} تكرار`:`${setsInfo}${it.target} reps`);\n        const tip = this.tipsFor(grp? grp.key : 'mob');\n        base.detailTip = isAr? tip.ar : tip.en;\n      }\n    }\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
